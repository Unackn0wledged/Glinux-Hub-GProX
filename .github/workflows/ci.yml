name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Arch container so libpipewire matches the target system (CachyOS).
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: System packages
        run: pacman -Syu --noconfirm --needed base-devel git clang pkgconf pipewire libpipewire rustup
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup default stable && rustup component add clippy rustfmt
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
