# gprox Broadcast: a fuller streaming voice. Warmer low-mids, presence,
# firmer compression and a de-esser.
name = "gprox Broadcast"

[engine.micopt]
enable = 1.0
volume = 0.7

[engine.dpop]
enable = 1.0
freq = 70.0

[engine.nr]
enable = 1.0
sensitivity = 8.0
bias = 2.5
attenuation_max = -18.0
release = 200.0

[engine.exp]
enable = 1.0
thresh = -46.0
ratio = 3.0
attenuation_max = -20.0
attack = 2.0
release = 150.0
hysteresis = 60.0
thresh_auto_enable = 0.0
thresh_auto_sense = 20.0

[engine.des]
enable = 1.0
freq = 5500.0
thresh = -2.0
ratio = 5.0
attack = 1.0
release = 100.0

[engine.veq]
enable = 1.0
low_freq = 200.0
low_width = 1.0
low_gain = 1.9952623   # +6 dB
mid_freq = 2500.0
mid_width = 0.8
mid_gain = 1.2589254   # +2 dB
high_freq = 5000.0
high_width = 1.0
high_gain = 1.3335214  # +2.5 dB

[engine.comp]
enable = 1.0
thresh = -32.0
ratio = 4.0
attack = 3.0
release = 120.0
makeup = 3.5481339     # +11 dB

[engine.lim]
boost = 3.9810717      # +12 dB
attack = 3.0
release = 150.0
